[project]
name = "besh"
version = "1.0.0"
description = "Batch Endpoint Service Handler - Production-ready batch processing with S3 support"
authors = [{name = "Floris Fok", email = "floris.fok@prosus.com"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "click>=8.1.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.0.0",
    "redis>=4.5.0",
    "asyncpg>=0.27.0",
    "sqlalchemy>=2.0.0",
    "litellm>=1.76.0",
    "aiofiles>=24.1.0",
    "python-multipart>=0.0.19",
    "python-dotenv>=1.1.0",
    "psycopg[binary]>=3.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
s3 = [
    "aioboto3>=12.0.0",
    "botocore>=1.31.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]
all = ["besh[s3,dev]"]

[project.scripts]
besh = "besh.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["besh"]

[tool.hatch.build.targets.wheel.force-include]
"besh/static" = "besh/static"

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[tool.uv.sources]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]  # Line too long (handled by formatter)

