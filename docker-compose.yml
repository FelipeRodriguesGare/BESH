version: '3.8'

services:

  # Postgres database (shared)
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      - POSTGRES_USER=replace_with_your_username
      - POSTGRES_PASSWORD=replace_with_your_password
      - POSTGRES_DB=batch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U replace_with_your_username -d batch"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - batch-network

  # Redis for caching and queuing
  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - batch-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # vLLM service for serving LLM models
  vllm:

    image: vllm/vllm-openai:latest
    container_name: vllm-server
    platform: linux/amd64
    ports:
      - "8000:8000"
    volumes:
      - vllm_models:/root/.cache/huggingface
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    command: [
      "--model", "${MODEL_NAME}",
      "--host", "0.0.0.0",
      "--port", "8000",
      "--tensor-parallel-size", "1",
      "--max-model-len", "32000",
    ]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - batch-network

  # Batch API service
  batch-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: batch-api
    ports:
      - "8080:8080"
    volumes:
      # OPTIONAL: Mount local development directory
      # - <your_local_directory>/<repo_name>:/app
      - batch_files:/tmp/batch_files
      - ./logs:/app/logs
    environment:
      - OPENAI_API_BASE=http://vllm:8000/v1
      - OPENAI_API_KEY=dummy-key
      - UPLOAD_FOLDER=/tmp/batch_files
      - PYTHONPATH=/app
      - SQLALCHEMY_DATABASE_URI=postgresql+psycopg://replace_with_your_username:replace_with_your_password@postgres:5432/batch
      - REDIS_URL=redis://redis:6379
      - DB_POOL_SIZE=20
      - DB_MAX_OVERFLOW=200
    depends_on:
      postgres:
        condition: service_healthy
      vllm:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - batch-network

  # Worker service for processing batch jobs (scalable with --scale worker=4)
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      - PYTHONPATH=/app
      - UPLOAD_FOLDER=/tmp/batch_files
      - OPENAI_API_BASE=http://vllm:8000/v1
      - SQLALCHEMY_DATABASE_URI=postgresql+psycopg://replace_with_your_username:replace_with_your_password@postgres:5432/batch
      - REDIS_URL=redis://redis:6379
      - MAX_WORKERS=64
      - LITELLM_MAX_CONNECTIONS=256
      - LITELLM_MAX_KEEPALIVE_CONNECTIONS=256
      - DB_POOL_SIZE=10
      - DB_MAX_OVERFLOW=50
      - WORKER_CONCURRENCY=16
      - BATCH_SIZE=32
    volumes:
      - batch_files:/tmp/batch_files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - batch-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import redis; r=redis.Redis(host=\"redis\", port=6379); r.ping()'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    # Remove container_name to allow scaling
    # Use: docker-compose up --scale worker=4

networks:
  batch-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  batch_files:
    driver: local
  vllm_models:
    driver: local
  redis_data:
    driver: local
