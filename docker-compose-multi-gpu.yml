version: '3.8'

services:

  # Postgres database (shared)
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      - POSTGRES_USER=replace_with_your_username
      - POSTGRES_PASSWORD=replace_with_your_password
      - POSTGRES_DB=batch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U replace_with_your_username -d batch"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - batch-network

  # Redis for caching and queuing
  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - batch-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Load balancer for distributing requests across vLLM instances
  nginx-lb:
    image: nginx:alpine
    container_name: nginx-load-balancer
    ports:
      - "8000:8000"
    volumes:
      - ./${NGINX_CONF:-nginx-24gpu.conf}:/etc/nginx/nginx.conf:ro
    depends_on:
      - vllm-gpu-0
      - vllm-gpu-1
      - vllm-gpu-2
      - vllm-gpu-3
      - vllm-gpu-4
      - vllm-gpu-5
      - vllm-gpu-6
      - vllm-gpu-7
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - batch-network
    extra_hosts:
      # Remote cluster A (map to REMOTE_CLUSTER_HOST_A)
      - "remote-vllm-gpu-0:${REMOTE_CLUSTER_HOST_A:-127.0.0.1}"
      - "remote-vllm-gpu-1:${REMOTE_CLUSTER_HOST_A:-127.0.0.1}"
      - "remote-vllm-gpu-2:${REMOTE_CLUSTER_HOST_A:-127.0.0.1}"
      - "remote-vllm-gpu-3:${REMOTE_CLUSTER_HOST_A:-127.0.0.1}"
      - "remote-vllm-gpu-4:${REMOTE_CLUSTER_HOST_A:-127.0.0.1}"
      - "remote-vllm-gpu-5:${REMOTE_CLUSTER_HOST_A:-127.0.0.1}"
      - "remote-vllm-gpu-6:${REMOTE_CLUSTER_HOST_A:-127.0.0.1}"
      - "remote-vllm-gpu-7:${REMOTE_CLUSTER_HOST_A:-127.0.0.1}"
      # Remote cluster B (map to REMOTE_CLUSTER_HOST_B)
      - "remote2-vllm-gpu-0:${REMOTE_CLUSTER_HOST_B:-127.0.0.1}"
      - "remote2-vllm-gpu-1:${REMOTE_CLUSTER_HOST_B:-127.0.0.1}"
      - "remote2-vllm-gpu-2:${REMOTE_CLUSTER_HOST_B:-127.0.0.1}"
      - "remote2-vllm-gpu-3:${REMOTE_CLUSTER_HOST_B:-127.0.0.1}"
      - "remote2-vllm-gpu-4:${REMOTE_CLUSTER_HOST_B:-127.0.0.1}"
      - "remote2-vllm-gpu-5:${REMOTE_CLUSTER_HOST_B:-127.0.0.1}"
      - "remote2-vllm-gpu-6:${REMOTE_CLUSTER_HOST_B:-127.0.0.1}"
      - "remote2-vllm-gpu-7:${REMOTE_CLUSTER_HOST_B:-127.0.0.1}"

  vllm-gpu-0:
    image: vllm/vllm-openai:latest
    container_name: vllm-server-gpu-0
    platform: linux/amd64
    volumes:
      - vllm_models:/root/.cache/huggingface
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    command: [
      "--model", "${MODEL_NAME}",
      "--host", "0.0.0.0",
      "--port", "8000",
      "--tensor-parallel-size", "1",
      "--max-model-len", "32000",
    ]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - batch-network

  vllm-gpu-1:
