  fast-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fast-api
    ports:
      - "8080:8080"
    volumes:
      - /home/floris/BatchEndpoint:/app
      - batch_files:/tmp/batch_files
      - ./logs:/app/logs
    environment:
      - OPENAI_API_BASE=http://nginx-lb:8000/v1
      - OPENAI_API_KEY=dummy-key
      - UPLOAD_FOLDER=/tmp/batch_files
      - PYTHONPATH=/app
      - SQLALCHEMY_DATABASE_URI=postgresql+psycopg://batch:batch@postgres:5432/batch
      - REDIS_URL=redis://redis:6379
      - DB_POOL_SIZE=20
      - DB_MAX_OVERFLOW=200
    depends_on:
      postgres:
        condition: service_healthy
      nginx-lb:
        condition: service_healthy
      redis:
        condition: service_healthy
      # worker dependency removed to support scaling (--scale worker=4)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - batch-network

  # Worker service for processing batch jobs (scalable with --scale worker=4)
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      - PYTHONPATH=/app
      - UPLOAD_FOLDER=/tmp/batch_files
      - OPENAI_API_BASE=http://nginx-lb:8000/v1
      - SQLALCHEMY_DATABASE_URI=postgresql+psycopg://replace_with_your_username:replace_with_your_password@postgres:5432/batch
      - REDIS_URL=redis://redis:6379
      - MAX_WORKERS=64
      - LITELLM_MAX_CONNECTIONS=256
      - LITELLM_MAX_KEEPALIVE_CONNECTIONS=256
      - DB_POOL_SIZE=10
      - DB_MAX_OVERFLOW=50
      - WORKER_CONCURRENCY=16
      - BATCH_SIZE=32
    volumes:
      - batch_files:/tmp/batch_files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - batch-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import redis; r=redis.Redis(host=\"redis\", port=6379); r.ping()'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    # Remove container_name to allow scaling
    # Use: docker-compose up --scale worker=4
 
networks:
  batch-network:
    driver: bridge

volumes:

  postgres_data:
    driver: local
  batch_files:
    driver: local
  vllm_models:
    driver: local
  redis_data:
    driver: local