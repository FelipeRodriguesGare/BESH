version: '3.8'

services:
  # Postgres database (shared)
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      - POSTGRES_USER=batch
      - POSTGRES_PASSWORD=testtest
      - POSTGRES_DB=batch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U batch -d batch"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - batch-network

  # Redis for caching and queuing
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - batch-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  batch-api-test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: batch-api-test
    ports:
      - "8080:8080"
    environment:
      - PYTHONPATH=/app
      - SQLALCHEMY_DATABASE_URI=postgresql+psycopg://batch:testtest@postgres:5432/batch
      - REDIS_URL=redis://redis:6379
      - MODEL_NAME=this_name_is_not_used
      - OPENAI_API_BASE=also_not_used
      - OPENAI_API_KEY=none
      - MAX_WORKERS=15
      - MAX_CONCURRENT_BATCHES=3
      - TESTING=active
      - UPLOAD_FOLDER=/tmp/batch_files
      - BASIC_AUTH_USERNAME=test
      - BASIC_AUTH_PASSWORD=test
      - API_KEY=test
    volumes:
      - database_test_data:/app/src/database
      - uploads_data:/tmp/batch_files
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - batch-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    # container_name removed to allow scaling
    environment:
      - PYTHONPATH=/app
      - UPLOAD_FOLDER=/tmp/batch_files
      - SQLALCHEMY_DATABASE_URI=postgresql+psycopg://batch:testtest@postgres:5432/batch
      - REDIS_URL=redis://redis:6379
      - MAX_WORKERS=10
      - OPENAI_API_BASE=${EXTERNAL_API_BASE}
      - OPENAI_API_KEY=${EXTERNAL_API_KEY}
      - MODEL_NAME=${EXTERNAL_MODEL_NAME}
    volumes:
      - uploads_data:/tmp/batch_files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      batch-api-test:
        condition: service_healthy
    networks:
      - batch-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import redis; r=redis.Redis(host=\"redis\", port=6379); r.ping()'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: batch-api-e2e-tests
    working_dir: /app
    volumes:
      - ./:/app:ro
    depends_on:
      batch-api-test:
        condition: service_healthy
      worker:
        condition: service_healthy
    networks:
      - batch-network
    environment:
      - PYTHONPATH=/app
      - BASE_URL=http://batch-api-test:8080/v1
      - MODEL_NAME=this_name_is_not_used
      - TESTING=active
      - API_KEY_HEADER=test
    command: ["pytest", "testing", "-v", "--color=yes"]

volumes:
  database_test_data:
  uploads_data:
  postgres_data:
  redis_data:

networks:
  batch-network:
    driver: bridge
