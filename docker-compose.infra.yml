version: '3.8'

services:
  # PostgreSQL database
  postgres:
    image: postgres:16
    container_name: besh-postgres
    environment:
      - POSTGRES_USER=replace_with_your_username
      - POSTGRES_PASSWORD=replace_with_your_password
      - POSTGRES_DB=batch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U replace_with_your_username -d batch"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - besh-network

  # Redis for caching and queuing
  redis:
    image: redis:7-alpine
    container_name: besh-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - besh-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  besh-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

